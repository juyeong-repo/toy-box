version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban']
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS 백엔드 서버
  backend:
    build:
      context: ./backend
    ports:
      - '3000:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kanban
      DB_PASSWORD: kanban
      DB_NAME: kanban
      JWT_SECRET: kanban-jwt-secret-key-production
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  # React 프론트엔드 (Nginx로 서빙)
  # context를 루트로 설정하여 shared/ 디렉토리에 접근 가능
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  postgres_data:
